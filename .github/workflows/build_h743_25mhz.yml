name: Build MatekH743 25MHz ArduPlane
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: USER=runner ./Tools/environment_install/install-prereqs-ubuntu.sh -y
      - run: sed -i 's/OSCILLATOR_HZ 8000000/OSCILLATOR_HZ 25000000/g' libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef-bl.dat libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef.dat
      - run: export PATH="/opt/gcc-arm-none-eabi-10-2020-q4-major/bin:$HOME/.local/bin:$PATH" && python3 ./Tools/scripts/build_bootloaders.py MatekH743 && ./waf configure --board MatekH743 && ./waf plane
      - uses: actions/upload-artifact@v4
        with:
          name: MatekH743_25MHz_ArduPlane_Firmware
          path: build/MatekH743/bin/
