name: Build MatekH743 25MHz ArduPlane 4.6.3

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ArduPilot Plane 4.6.3 source
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: Plane-4.6.3
          submodules: recursive

      - name: Verify source version
        run: |
          git log -1 --format='Commit: %H%nSubject: %s'
          test "$(git describe --tags --exact-match)" = "Plane-4.6.3"

      - name: Install build dependencies
        run: USER=runner ./Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Set oscillator to 25MHz
        run: |
          sed -i 's/^OSCILLATOR_HZ 8000000$/OSCILLATOR_HZ 25000000/' \
            libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef-bl.dat \
            libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef.dat
          grep -n '^OSCILLATOR_HZ' \
            libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef-bl.dat \
            libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef.dat
          test "$(grep -c '^OSCILLATOR_HZ 25000000$' libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef-bl.dat)" -eq 1
          test "$(grep -c '^OSCILLATOR_HZ 25000000$' libraries/AP_HAL_ChibiOS/hwdef/MatekH743/hwdef.dat)" -eq 1

      - name: Build bootloader and ArduPlane
        run: |
          export PATH="/opt/gcc-arm-none-eabi-10-2020-q4-major/bin:$HOME/.local/bin:$PATH"
          python3 ./Tools/scripts/build_bootloaders.py MatekH743
          ./waf configure --board MatekH743
          ./waf plane

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MatekH743_25MHz_ArduPlane_4.6.3_Firmware
          path: build/MatekH743/bin/
          if-no-files-found: error
